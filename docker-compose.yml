# Whole stack on one machine:  cp .env.example .env  (add an LLM key)  then  docker compose up --build
# UI http://localhost:3000 · API http://localhost:8000/docs · Postgres localhost:5433
# Production does NOT use this file: UI -> Vercel, API -> Dockerfile on Render/Fly, DB -> managed Postgres.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loan_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-loan_intake}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-loan}"]
      interval: 2s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false # LLM keys / provider come from here
    environment:
      # Overrides any DATABASE_URL in .env: inside the compose network the DB host is the service name `db`, port 5432.
      DATABASE_URL: postgresql://${POSTGRES_USER:-loan}:${POSTGRES_PASSWORD:-loan_dev_pw}@db:5432/${POSTGRES_DB:-loan_intake}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}

  web:
    build:
      context: apps/web
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
